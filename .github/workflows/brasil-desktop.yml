name: Brasil · validação alternativa da 0.4 no Apple Silicon
on:
  push:
    branches: [validar/apple-silicon-04]
    paths: ['brasil/**', 'app/bridge.py', 'app/shell_macos.py', 'app/shell_windows.py', 'app/process_tree.py', 'engine/setup/**', 'tools/*desktop.py', 'LICENSE', 'THIRD_PARTY_NOTICES.md', '.github/workflows/brasil-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aplicativos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4.0-alpha.4
          persist-credentials: false
      - name: Conferir revisão e arquitetura do pacote
        run: |
          test "$(git rev-parse HEAD)" = '910b1dbf2e1c6bb260ac357df815afb4a2b7e892'
          test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r brasil/requirements_desktop.txt
      - run: python -B -m unittest brasil.tests.test_core brasil.tests.test_arquivos brasil.tests.test_api brasil.tests.test_mapas brasil.tests.test_fontes brasil.tests.test_plataforma brasil.tests.test_processos -v
      - uses: actions/cache/restore@v4
        id: motor
        with:
          path: brasil/runtime
          key: desktop-motor-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('brasil/build_runtime.py') }}
      - if: steps.motor.outputs.cache-hit != 'true'
        run: python -B brasil/build_runtime.py
      - uses: actions/cache/save@v4
        if: steps.motor.outputs.cache-hit != 'true'
        with:
          path: brasil/runtime
          key: desktop-motor-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('brasil/build_runtime.py') }}
      - uses: actions/cache/restore@v4
        id: modelo
        with:
          path: derived/desktop-model.gguf
          key: desktop-modelo-${{ runner.os }}-${{ matrix.arch }}-qwen3-06b-q8-v1
      - run: python -B tools/modelo_teste_desktop.py
      - uses: actions/cache/save@v4
        if: steps.modelo.outputs.cache-hit != 'true'
        with:
          path: derived/desktop-model.gguf
          key: desktop-modelo-${{ runner.os }}-${{ matrix.arch }}-qwen3-06b-q8-v1
      - name: Empacotar o código publicado
        run: GITHUB_SHA="$(git rev-parse HEAD)" python -B brasil/build_desktop.py
      - run: python -B tools/medir_memoria_desktop.py
      - if: runner.os == 'macOS'
        name: Registrar memória e liberar cache da compilação no runner
        run: |
          mkdir -p derived/desktop-results
          { sysctl hw.memsize; vm_stat; } > derived/desktop-results/memoria-antes.log
          sudo -n /usr/sbin/purge
          vm_stat > derived/desktop-results/memoria-depois.log
      - run: python -B tools/testar_desktop.py
      - if: runner.os == 'macOS'
        run: |
          python -B tools/testar_desktop.py --imagem derived/desktop-release --rotulo dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-resultados-${{ matrix.artifact }}
          path: |
            derived/desktop-results/*
      - uses: actions/upload-artifact@v4
        with:
          name: ultimo-livro-${{ matrix.artifact }}
          path: derived/desktop-release/*
