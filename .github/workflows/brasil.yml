name: Brasil · testes e pacote Linux
on:
  push:
    branches: [main]
    paths: ['brasil/**', 'app/bridge.py', 'app/shell_linux.py', 'engine/setup/**', 'site-brasil/**', '.github/workflows/brasil.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --only-binary=:all: libzim==3.13.1 osmium==4.3.2 pyshp==3.1.9
      - run: python -B -m unittest discover -s brasil/tests -v
      - run: node --check brasil/web/app.js && node --check site-brasil/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python site-brasil/build.py
      - run: npm ci --prefix site-brasil --ignore-scripts --no-audit --no-fund --no-bin-links
      - run: npm test --prefix site-brasil
  pacote:
    runs-on: ubuntu-24.04
    needs: testar
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv derived/brasil-deps
          derived/brasil-deps/bin/pip install --only-binary=:all: --no-compile --target brasil/vendor libzim==3.13.1
      - uses: actions/cache@v4
        id: motor
        with:
          path: brasil/runtime
          key: ultimo-livro-ubuntu24-cpu-${{ hashFiles('brasil/build_runtime.sh') }}
      - if: steps.motor.outputs.cache-hit != 'true'
        run: bash brasil/build_runtime.sh
      - run: bash brasil/build_deb.sh
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-soup-3.0 xvfb
          dpkg-deb --extract derived/brasil-build/*.deb /tmp/ultimo-livro-pacote
          ULTIMO_LIVRO_TEST_ROOT=/tmp/ultimo-livro-pacote/opt/ultimo-livro WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a /usr/bin/python3 -B brasil/tests/smoke_gtk.py
      - uses: actions/upload-artifact@v4
        with:
          name: ultimo-livro-linux-amd64-alpha
          path: derived/brasil-build/*
