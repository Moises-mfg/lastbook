name: Brasil · testes e pacote Linux
on:
  push:
    branches: [main]
    paths: ['brasil/**', 'app/bridge.py', 'app/shell_linux.py', 'engine/setup/**', 'site-brasil/**', 'tools/testar_linux.py', 'tools/modelo_teste_desktop.py', 'LICENSE', 'THIRD_PARTY_NOTICES.md', '.github/workflows/brasil.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --only-binary=:all: libzim==3.13.1 osmium==4.3.2 pyshp==3.1.9
      - run: python -B -m unittest discover -s brasil/tests -v
      - run: python -B -m unittest app.tests.test_setup -v
      - run: node --check brasil/web/app.js && node --check brasil/web/mapas.js && node --check site-brasil/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python site-brasil/build.py
      - run: npm ci --prefix site-brasil --ignore-scripts --no-audit --no-fund --no-bin-links
      - run: npm test --prefix site-brasil
  leitores-zim:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B brasil/build_zim.py
      - run: |
          ABI=$(python -c 'import sys;print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
          PYTHONPATH="brasil/vendor/$ABI" python -B -m unittest brasil.tests.test_arquivos -v
  pacote:
    runs-on: ubuntu-24.04
    needs: [testar, leitores-zim]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B brasil/build_zim.py
      - uses: actions/cache@v4
        id: motor
        with:
          path: brasil/runtime
          key: ultimo-livro-ubuntu24-cpu-${{ hashFiles('brasil/build_runtime.sh') }}
      - if: steps.motor.outputs.cache-hit != 'true'
        run: bash brasil/build_runtime.sh
      - run: bash brasil/build_deb.sh
      - name: Instalar dependências gráficas do teste Linux
        # O WebKit e suas dependências podem levar vários minutos no espelho do runner.
        timeout-minutes: 18
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" -q update
          sudo apt-get "${apt_options[@]}" -qy install python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-soup-3.0 xvfb
      - name: Abrir a janela do pacote Linux extraído
        timeout-minutes: 3
        run: |
          dpkg-deb --extract derived/brasil-build/*.deb /tmp/ultimo-livro-pacote
          ULTIMO_LIVRO_TEST_ROOT=/tmp/ultimo-livro-pacote/opt/ultimo-livro WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a /usr/bin/python3 -B brasil/tests/smoke_gtk.py
      - uses: actions/cache/restore@v4
        id: modelo
        with:
          path: derived/desktop-model.gguf
          key: desktop-modelo-${{ runner.os }}-x64-qwen3-06b-q8-v1
      - run: python3 -B tools/modelo_teste_desktop.py
      - uses: actions/cache/save@v4
        if: steps.modelo.outputs.cache-hit != 'true'
        with:
          path: derived/desktop-model.gguf
          key: desktop-modelo-${{ runner.os }}-x64-qwen3-06b-q8-v1
      - name: Validar janela e IA do pacote Linux extraído
        timeout-minutes: 8
        run: |
          WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a /usr/bin/python3 -I -B tools/testar_linux.py --raiz /tmp/ultimo-livro-pacote/opt/ultimo-livro --modelo derived/desktop-model.gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-resultados-linux-x64
          path: |
            derived/desktop-results/linux-empacotado.json
            derived/desktop-results/linux-empacotado.png
      - uses: actions/upload-artifact@v4
        with:
          name: ultimo-livro-linux-amd64-alpha
          path: derived/brasil-build/*
